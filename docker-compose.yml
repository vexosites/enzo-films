services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - media_data:/app/media
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATABASE_URL=postgresql://opencode:opencode@db:5432/opencode?schema=public
    command: sh -c "npx prisma db push && node .output/server/index.mjs"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: opencode
      POSTGRES_PASSWORD: opencode
      POSTGRES_DB: opencode
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencode"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  media_data:
  pg_data: