services:
  app:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - media_data:/app/media
    environment:
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - DATABASE_URL=postgresql://opencode:opencode@db:5432/opencode?schema=public

    command: >
      sh -c "
      apk add --no-cache openssl &&
      npm install &&
      npx prisma generate &&
      npx prisma db push &&
      npm run dev -- --host 0.0.0.0
      "

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: opencode
      POSTGRES_PASSWORD: opencode
      POSTGRES_DB: opencode
    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencode"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  media_data:
  pg_data: